<mat-sidenav-container class="layout-container" autosize>
  <mat-sidenav position="end"  mode="side" opened [class.collapsed]="collapsed()" class="sidenav">
    <div class="brand">
      <button mat-icon-button (click)="toggleMenu()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      @if (!collapsed()) {
        <span>AquaLife Aquatic Centers</span>
      }
    </div>

    <mat-nav-list>
      @for (option of options; track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
          @if (!collapsed()) {
            <span matListItemTitle>{{ option.label }}</span>
          }
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content-shell">
    <mat-toolbar>
      <button matIconButton class="example-icon" aria-label="Example icon-button with menu icon">
        <mat-icon>Shark</mat-icon>
      </button>
      <span>AquaLife Aquatic Center Management Platform</span>
      <span class="example-spacer"></span>
      <button matIconButton class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
      </button>
      <button matIconButton class="example-icon" aria-label="Example icon-button with share icon">
        <mat-icon>share</mat-icon>
      </button>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet/>
    </main>
    <app-footer-content/>
  </mat-sidenav-content>
</mat-sidenav-container>
